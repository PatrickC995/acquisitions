name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        id: prettier
        run: npm run format:check
        continue-on-error: true

      - name: Annotate ESLint issues
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::error title=ESLint Issues Found::ESLint found issues that need to be fixed."
          echo "Run 'npm run lint:fix' to automatically fix many of these issues."

      - name: Annotate Prettier issues
        if: steps.prettier.outcome == 'failure'
        run: |
          echo "::error title=Prettier Formatting Issues::Code formatting issues were found."
          echo "Run 'npm run format' to automatically fix formatting."

      - name: Fail if issues found
        if: steps.eslint.outcome == 'failure' || steps.prettier.outcome == 'failure'
        run: |
          echo "Lint and/or format checks failed. Please fix the issues."
          exit 1

      - name: Success summary
        if: steps.eslint.outcome == 'success' && steps.prettier.outcome == 'success'
        run: |
          echo "✅ All lint and format checks passed!"
          echo "### Lint and Format Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ESLint: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prettier: Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All code quality checks passed successfully!" >> $GITHUB_STEP_SUMMARY
